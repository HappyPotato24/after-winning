function domKey(node){

function chart(){const plotWidth=window.innerWidth<720?260:670;const r=s.round,h=r?r.history:[[0,100,.5]],values=h.map(x=>x[1]),min=Math.min(100,...values),max=Math.max(100,...values),pad=Math.max((max-min)*.25,.03),lo=min-pad,hi=max+pad,y=v=>220-(v-lo)/(hi-lo)*200,x=v=>v/(r?.duration||15)*plotWidth;const path=h.map((v,i)=>`${i?'L':'M'}${x(v[0]).toFixed(2)},${y(v[1]).toFixed(2)}`).join(' ');return `<svg class="chart" viewBox="0 0 ${plotWidth+80} 255" role="img" aria-label="标的资产价格曲线，虚线为本轮开盘价"><defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b6f36c" stop-opacity=".18"/><stop offset="100%" stop-color="#b6f36c" stop-opacity="0"/></linearGradient></defs>${[0,.25,.5,.75,1].map(f=>`<path d="M0 ${20+f*200}H${plotWidth}" stroke="#28323e" stroke-dasharray="3 5"/><text x="${plotWidth+14}" y="${24+f*200}">${(hi-f*(hi-lo)).toFixed(3)}</text>`).join('')}<path d="M0 ${y(100)}H${plotWidth}" stroke="#82909f" stroke-dasharray="6 5"/><text x="5" y="${y(100)-7}">开盘 100.000</text><path d="${path} L${x(h[h.length-1][0])},220 L0,220Z" fill="url(#fade)"/><path d="${path}" fill="none" stroke="#b6f36c" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${x(h[h.length-1][0])}" cy="${y(h[h.length-1][1])}" r="4" fill="#b6f36c"/><text x="0" y="246">本轮开盘</text><text x="${plotWidth-60}" y="246">${gameTime(r?.duration||s.nextPeriod)} 时:分</text></svg>`;}
function positions(){return s.positions.length?s.positions.map(o=>{const p=G.price(s.round,o.side),value=Math.max(0,Math.round(o.q*p*100+(o.grossCarry||0))-o.finance),sell=Math.max(0,Math.round(o.q*p*100+(o.grossCarry||0))-Math.round(o.q*p*100*G.rate(p))-o.finance);return `<div class="position" data-key="position-${o.id}"><div class="row between"><b class="${o.side==='up'?'positive':'negative'}">${o.side==='up'?'看涨 ↑':'看跌 ↓'} <span class="badge">${o.leverage}× 逐仓</span></b><b>${money(value)} U</b></div><small>${o.q.toFixed(4)} 份 · 买价 ${o.p.toFixed(4)} · 剩余总支出 ${money(o.budget)} U<br>剩余融资 ${money(o.finance)} U · 当前全部卖出可得 ${money(sell)} U</small><div class="row"><button data-action="sell" data-id="${o.id}" data-fraction=".25" ${s.paused||s.guide<=2||s.ended?'disabled':''}>卖 25%</button><button data-action="sell" data-id="${o.id}" data-fraction=".5" ${s.paused||s.guide<=2||s.ended?'disabled':''}>卖 50%</button><button data-action="sell" data-id="${o.id}" data-fraction="1" ${s.paused||s.guide<=2||s.ended?'disabled':''}>全部卖出</button></div></div>`;}).join(''):'<div class="empty">暂无持仓。等待，也是一种选择。</div>';}
function trade(){const r=s.round,guide=s.guide<=2,p=r?G.price(r,side):.5,rem=r?r.duration-r.elapsed:0;return `${guide?`<div class="notice"><b>${s.guide===1?'序章 01 / 一万元梭哈，百倍逆转':'序章 02 / 拿出余额一半，又输了'}</b><p>${s.guide===1?'固定剧情：用全部 10,000 U 买入 0.01 U 的涨份额，费用包含在投入内。':'固定剧情：用实际余额的一半买入 0.50 U 的涨份额，另一半留在账户。'} 下单后经过 5 秒波动再结算。引导期间限制其他操作。</p></div>`:''}<div class="workspace"><section><div class="panel"><div class="panel-header"><div class="instrument"><div class="coin">S</div><div><h3>星河指数 <span class="badge">模拟标的</span></h3><small>预测本轮收盘价相对开盘价的涨跌</small></div></div><span class="badge">${r?`第 ${r.id} 轮 · ${s.paused?'已暂停':r.guide&&!r.started?'等待引导下单':'行情进行中'}`:'轮间休息'}</span></div><div class="row between"><div><div class="amount">${(r?.spot||100).toFixed(3)} <small>指数点</small></div><small>这是标的资产价格，不是份额价格</small></div><div style="text-align:right"><b>${r?`游戏剩余 <span id="game-countdown">${gameTime(rem)}</span> <small>（时:分）</small>`:'下一轮，由你开始'}</b><br><small>${r?`现实等待 <span id="real-countdown">${realTime(rem)}</span>（分:秒）`:'行情不会自动连开'}</small></div></div>${chart()}<div class="price-cards"><div class="price-card"><small>涨份额 · 买卖价格</small><strong class="positive">${(r?.p||.5).toFixed(4)} <small>U / 份</small></strong><small>猜对总返还约 ${(1/(r?.p||.5)).toFixed(2)} 倍（未扣费）</small></div><div class="price-card"><small>跌份额 · 买卖价格</small><strong class="negative">${(1-(r?.p||.5)).toFixed(4)} <small>U / 份</small></strong><small>猜对总返还约 ${(1/(1-(r?.p||.5))).toFixed(2)} 倍（未扣费）</small></div></div><div class="progress"><span style="width:${r?r.elapsed/r.duration*100:0}%"></span></div><div class="row between"><label class="muted">下轮周期 <select id="period" ${guide?'disabled':''}>${[[5,'游戏 00:05 / 现实 00:05'],[15,'游戏 00:15 / 现实 00:15'],[60,'游戏 01:00 / 现实 01:00'],[1440,'游戏 24:00 / 现实 24:00']].map(([n,t])=>`<option value="${n}" ${s.nextPeriod===n?'selected':''}>${t}</option>`).join('')}</select></label><div class="row">${r?`<button data-action="pause">${s.paused?'恢复行情':'暂停'}</button><button data-action="fast" ${guide?'disabled':''}>快进至结算 →</button>`:`<button class="primary" data-action="start">${guide?'开始引导行情':'开启下一轮 →'}</button>`}</div></div></div><div class="panel"><div class="panel-header"><h3>当前持仓 <span class="badge">${s.positions.length} 笔</span></h3><small>逐笔隔离 · 无跨账户扣款</small></div>${positions()}</div><div class="panel"><div class="summary-strip"><div><small>已实现交易盈亏</small><strong class="${s.stats.pnl>=0?'positive':'negative'}">${money(s.stats.pnl)} U</strong></div><div><small>累计手续费</small><strong>${money(s.stats.fees)} U</strong></div><div><small>交易账户历史峰值</small><strong>${money(s.stats.peak)} U</strong></div></div></div></section><aside><div class="panel"><div class="panel-header"><h3>交易订单</h3><small>全部为虚拟资金</small></div><div class="seg"><button data-action="side" data-id="up" class="${side==='up'?'selected':''}" ${guide?'disabled':''}>涨 ↑</button><button data-action="side" data-id="down" class="down ${side==='down'?'selected':''}" ${guide?'disabled':''}>跌 ↓</button></div><label class="field" for="amount">本次总支出（已包含手续费）</label><input class="wide" id="amount" inputmode="decimal" type="number" min="0.01" step="0.01" value="${guide?money(guideBudget()).replaceAll(',',''):esc(amount)}" ${guide?'disabled':''}><div class="quick">${[10,25,50,100].map(n=>`<button data-action="quick" data-n="${n}" ${guide?'disabled':''}>${n===100?'全部':n+'%'}</button>`).join('')}</div><span class="field">逐仓杠杆 · 游戏自定义模拟</span><div class="seg">${[1,2,5,10].map(n=>`<button data-action="leverage" data-n="${n}" class="${leverage===n?'selected':''}" ${guide?'disabled':''}>${n}×</button>`).join('')}</div><div id="preview"></div><button class="primary wide" data-action="buy" ${!r||s.paused||guide&&r.started?'disabled':''}>${guide?'确认剧情订单':'买入'+(side==='up'?'涨':'跌')+'份额'}</button><small style="display:block;margin-top:12px">正确方向结算每份兑付 1 U，错误方向归零。买卖均计费，结算兑付不另收费。</small></div><div class="panel"><span class="eyebrow">交易之外，还有生活</span><div class="story-note" style="margin-top:18px"><h3>${esc(s.events.at(-1).title)}</h3><p>${esc(s.events.at(-1).text)}</p></div><button class="quiet wide" style="margin-top:20px" data-action="tab" data-id="story">查看人生轨迹 ↗</button></div></aside></div>`;}
function guideBudget(){return s.round?.guide&&s.round.started&&s.positions.length?s.positions[0].initial:s.guide===1?s.cash:Math.floor(s.cash/2);}
function preview(){if(!$('preview'))return;try{const budget=s.guide<=2?guideBudget():G.cents(Number(amount));const p=s.guide===1?.01:s.guide===2?.5:s.round?G.price(s.round,side):.5,q=G.quote(budget,p,leverage);updateHTML($('preview'),`<div class="breakdown"><div><span>可用余额</span><b>${money(s.cash)} U</b></div><div><span>买入保证金</span><b>${money(q.margin)} U</b></div><div><span>手续费（${(G.rate(p)*100).toFixed(3)}%）</span><b>${money(q.fee)} U</b></div><div><span>逐仓融资</span><b>${money(q.finance)} U</b></div><div><span>预计获得份额</span><b>${q.q.toFixed(4)}</b></div><div><span>猜对返还 · 已偿融资</span><b class="positive">${money(Math.max(0,Math.round(q.q*100)-q.finance))} U</b></div><div><span>最大损失</span><b class="negative">${money(budget)} U</b></div></div><small>${leverage>1?'净清算权益 ≤ 初始保证金 12% 时强平，剩余权益退回。':'总返还包含本金；买入价格越低，模型获胜概率通常越低。'}<br>预览随行情变化，点击时按当时价格成交。</small>`);}catch(e){updateHTML($('preview'),'<p class="muted" style="margin:20px 0">请输入有效投入金额。</p>');}}
function life(){return `<div class="notice"><b>交易之外，生活照常。</b><p>工作、休息和变卖都会推进时间，期间逐步模拟现有持仓。每日生活费从银行扣除，不足部分记为生活欠款。</p></div><div class="grid2"><section><div class="panel"><h2>两个口袋</h2><p class="muted">提现不会产生利润；存款不会自动补充交易亏损。</p><label class="field" for="transferAmount">转移金额 / U</label><input id="transferAmount" class="wide" type="number" min=".01" step=".01" value="1000"><div class="row" style="margin-top:14px"><button class="primary" data-action="out">提现到银行 ↗</button><button data-action="in">存款转入交易</button></div></div><div class="panel"><h2>把日子过下去</h2><div class="breakdown"><div><span>工作一天收入</span><b>${money(s.wage)} U</b></div><div><span>每天生活费</span><b>${money(s.expense)} U</b></div><div><span>下一次日结预计债息</span><b>${money(Math.round(s.debt*.0003))} U</b></div></div><div class="row"><button class="primary" data-action="work">工作一天</button><button data-action="rest">休息一天</button></div><small>工资在一天结束后到账。两个选择都会推进完整 24 小时。</small></div><div class="panel"><h2>生活借款</h2><div class="breakdown"><div><span>当前债务</span><b class="negative">${money(s.debt)} U</b></div><div><span>剩余可借额度</span><b>${money(Math.max(0,s.limit-s.debt))} U</b></div><div><span>利率 / 计息方式</span><b>每日 0.03% / 每日复利</b></div></div><label class="field" for="debtAmount">借款或还款金额 / U</label><input id="debtAmount" class="wide" type="number" min=".01" step=".01" value="1000"><div class="row" style="margin-top:14px"><button data-action="borrow">借入银行</button><button data-action="repay">从银行还款</button></div><small>生活借款与逐仓融资独立。欠款不会因账户归零而消失。</small></div></section><section><div class="panel"><h2>生活里的东西</h2><p class="muted">净资产按账面价值计算；实际出售存在折价。</p>${s.assets.map(a=>`<div class="asset"><div class="row between"><h3>${a.name}</h3><span class="badge">${a.sold?'已出售':'持有中'}</span></div><div class="breakdown"><div><span>账面价值</span><b>${money(a.value)} U</b></div><div><span>出售所得（${a.discount*100}%）</span><b>${money(Math.round(a.value*a.discount))} U</b></div></div><small>耗时 ${a.days} 天。${a.id==='car'?'售后工资减少 15%，每日通勤开支增加 20 U。':a.id==='home'?'售后每日增加 120 U 租金。':'出售不影响工资。'}</small><div class="row"><button data-action="asset" data-id="${a.id}" ${a.sold?'disabled':''}>变卖${a.name}</button></div></div>`).join('')}</div><div class="panel"><span class="eyebrow">这是选择，无关评分</span><h2 style="margin-top:10px">可以就到这里。</h2><p class="muted" style="margin:15px 0">收手会按当前价格平掉持仓，计入费用并生成离场故事。债务和经历都会留下。</p><button class="primary" data-action="leave">收手，离开交易</button><details style="margin-top:24px"><summary class="muted">人物故事终止选项</summary><p class="muted" style="margin:15px 0">虚构人物终止选择，不描写过程，没有奖励，不清除债务；可以取消后继续生活。</p><button class="danger" data-action="suicide">跳楼</button></details></div></section></div>`;}
function story(){return `<div class="panel-header"><div><span class="eyebrow">你实际走过的路</span><h2>人生轨迹</h2><p class="muted">${s.events.length} 个节点 · 每个节点都是实际发生的选择与后果。点击查看当时的账本。</p></div></div><div class="timeline">${[...s.events].reverse().map(e=>`<button class="node" data-action="node" data-id="${e.id}"><small>${date(e.time)} · ${esc(e.kind==='trade'?'交易':e.kind==='ending'?'离场':'经历')}</small><h3>${esc(e.title)}</h3><p>${esc(e.text)}</p><small>净资产 ${money(e.net)} U · 债务 ${money(e.debt)} U</small></button>`).join('')}</div>`;}
function ledger(){return `<div class="panel"><h2>交易与资金流水</h2><p class="muted">${s.ledger.length} 条记录，最近 300 条展示于此；完整记录保存在导出文件中。手续费已包含在现金变动内，不重复扣除。</p><div class="scroll"><table><thead><tr><th>时间 / 行为</th><th>交易现金变动</th><th>银行变动</th><th>债务变动</th><th>其中手续费</th><th>详情</th></tr></thead><tbody>${s.ledger.slice(-300).reverse().map(e=>`<tr><td>${esc(e.type)}<br><small>${date(e.time)}</small></td><td>${money(e.cash)}</td><td>${money(e.bank)}</td><td>${money(e.debt)}</td><td>${money(e.fee)}</td><td>${esc(e.note)}</td></tr>`).join('')}</tbody></table></div></div>`;}
function end(){const net=G.total(s),title=s.ended==='suicide'?'没有下一页的故事':s.debt>0?'带着账单，走回生活':net>=100000000?'百万之后，选择离场':net<=0?'从不宽裕的明天开始':s.flags.zero?'重新找回日常':'把赢过的，留给以后';return `<section class="panel end"><span class="eyebrow">你的故事 / ${date(s.time)}</span><h2>${title}</h2><p>${esc(s.events.at(-1).text)}</p><div class="summary-strip"><div><small>离场净资产</small><strong>${money(net)} U</strong></div><div><small>未偿生活债务</small><strong>${money(s.debt)} U</strong></div><div><small>走过的节点</small><strong>${s.events.length}</strong></div></div><p class="muted">${s.ended==='suicide'?'记录保留在终止时刻；当前仓位仅作为静态快照，不再推进。':'这不是评分。你的存款、卖掉的东西、还掉的债和没有继续下注的时刻，都属于这个故事。'}</p><div class="row"><button class="primary" data-action="export">导出这段故事</button><button data-action="new">另开一个独立故事</button><button data-action="tab" data-id="story">回看人生轨迹</button></div></section>`;}
function render(){const active=document.activeElement,id=active?.id,selection=active?.selectionStart;if(!s){updateHTML($('app'),creation());return;}updateHTML($('app'),stats()+`<div class="row between"><nav class="tabs">${[['trade','交易终端'],['life','生活与资产'],['story','人生轨迹'],['ledger','资金流水']].map(([id,t])=>`<button data-action="tab" data-id="${id}" class="${tab===id?'active':''}" ${id==='life'&&s.guide<=2&&!s.ended?'disabled':''}>${t}</button>`).join('')}${s.ended?'<button data-action="tab" data-id="ending">离场记录</button>':''}</nav><small>${date(s.time)} · ${G.backgrounds.find(b=>b.id===s.background).name} · ${s.ended?'故事已封存':s.paused?'时钟暂停':'时钟运行'}</small>${s.ended?'':'<button class="quiet" data-action="leave">收手离场</button>'}</div>`+(s.ended&&tab!=='story'&&tab!=='ledger'?end():tab==='trade'?trade():tab==='life'?life():tab==='story'?story():ledger()));preview();if(id&&$(id)&&!$(id).disabled){$(id).focus({preventScroll:true});try{$(id).setSelectionRange(selection,selection);}catch{}}}
function refreshMarket(){// Reconcile changing text and SVG attributes without replacing interaction targets.
if(tab==='trade')render();else if(s.round===null)render();}
function exportSave(){if(!s)return notify('先创建一个故事。');persist();const blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`赢过以后-第${Math.floor(s.time/1440)+1}天-${Date.now()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('存档已导出。');}
function readAmount(id){const n=Number($(id)?.value);if(!Number.isFinite(n)||n<=0)throw Error('请输入大于零的金额');return G.cents(n);}
document.addEventListener('input',e=>{if(e.target.id==='amount'){amount=e.target.value;preview();}});
document.addEventListener('change',e=>{if(e.target.id==='period')run(()=>s.nextPeriod=Number(e.target.value),'新周期将在下一轮生效。');});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(['buy','sell'].includes(a)){const now=performance.now();if(now-lastTradeClick<300)return;lastTradeClick=now;}if(modalOpen&&!['cancel','confirm'].includes(a))return;if(a==='cancel'){closeDialog();return;}if(a==='confirm'){const fn=modalCallback;closeDialog();if(fn)run(fn);return;}if(a==='help'){dialog('先分清：标的价格与份额价格','标的：星河指数的随机价格路径，开盘为 100。收盘高于开盘判涨，否则判跌（平价归跌）。\n份额：0.01～0.99 U 买卖，猜对每份兑付 1 U，猜错归零。1 ÷ 买价为未扣费总返还倍数，包含本金。\n费用：本游戏模拟费率为 p≤0.5 时 2%；p>0.5 时 2%×(1−p)÷p。输入金额包含手续费，结算无额外费用。现金按分记账；部分卖出不足一分的毛款保留到该仓位后续出售，最后一次统一四舍五入，避免拆单凭空增加资金。份额保留 8 位小数，计算成交份额时不提前把成交额取整。\n杠杆：游戏自定义逐仓机制；融资不计息，每笔净清算权益低于保证金 12% 时平仓，最大损失为该笔总支出。总净资产中的持仓权益已扣融资、未扣未发生的卖出费。\n公平行情：独立高斯对数随机游走，份额价格由当前位置、固定漂移和剩余波动计算，再截断到 0.01～0.99。有限步长和价格边界意味着它是近似概率。随机数与玩家方向、金额和盈亏无关。前两局是明确的固定剧情。\n时间：游戏 1 分钟＝现实 1 秒。轮间休息时冻结；切换标签、弹窗、读档均暂停，需手动恢复。工作和变卖会逐步处理本轮风险，再推进剩余日历。每日 0 点扣生活费与债息。\n这些是游戏规则，不承诺与任何平台规则一致。');return;}if(a==='save'){if(s)s.paused=true;modalOpen=true;$('modal').innerHTML='<div class="modal-box"><h2 id="modal-title">保存这段人生</h2><p>自动保存在本浏览器。离开页面后暂停，不追算离线行情。换设备或备份请导出 JSON。</p><div class="row"><button id="exportDirect">导出 JSON</button><button id="importDirect">导入 JSON</button><button data-action="cancel">关闭</button></div></div>';$('modal').classList.remove('hidden');$('exportDirect').onclick=exportSave;$('importDirect').onclick=()=>$('file').click();persist();render();return;}if(a==='create'){run(()=>{const seed=crypto.getRandomValues(new Uint32Array(1))[0];s=G.newGame(b.dataset.id,seed);side='up';leverage=1;tab='trade';});return;}if(!s)return;if(a==='export'){exportSave();return;}if(a==='tab'){tab=b.dataset.id;render();return;}if(a==='node'){const ev=s.events.find(x=>x.id===Number(b.dataset.id));dialog(ev.title,`${ev.text}\n\n${date(ev.time)}\n交易余额 ${money(ev.cash)} U\n银行存款 ${money(ev.bank)} U\n生活债务 ${money(ev.debt)} U\n总净资产 ${money(ev.net)} U`);return;}if(a==='new'){dialog('另开一段人生','当前故事会先自动导出为 JSON，再开始独立的新故事。旧记录不会带入新故事。','导出并重新开始',()=>{exportSave();s=null;localStorage.removeItem(KEY);tab='trade';side='up';leverage=1;render();});return;}if(s.ended)return;if(a==='start'){run(()=>{G.startRound(s);last=performance.now();acc=0;});return;}if(a==='pause'){run(()=>{s.paused=!s.paused;last=performance.now();acc=0;});return;}if(a==='fast'){run(()=>{G.advance(s,s.round.duration-s.round.elapsed);s.paused=true;});return;}if(a==='side'){side=b.dataset.id;render();return;}if(a==='leverage'){leverage=Number(b.dataset.n);render();return;}if(a==='quick'){amount=(Math.floor(s.cash*Number(b.dataset.n)/100)/100).toFixed(2);render();return;}if(a==='buy'){run(()=>{const budget=s.guide<=2?(s.guide===1?s.cash:Math.floor(s.cash/2)):G.cents(Number(amount));G.buy(s,side,budget,leverage);},'订单已成交，费用已包含在总支出内。');return;}if(a==='sell'){run(()=>G.close(s,Number(b.dataset.id),Number(b.dataset.fraction)),'已按当前价格卖出，融资与费用已结清。');return;}try{if(a==='out'||a==='in'){const n=readAmount('transferAmount');run(()=>G.transfer(s,n,a),'资金已转移。');}if(a==='borrow'||a==='repay'){const n=readAmount('debtAmount');dialog(a==='borrow'?'确认生活借款':'确认还款',a==='borrow'?`借入 ${money(n)} U 至银行。负债同步增加，每日按 0.03% 复利计息。生活借款不会因交易强平而消失。`:`从银行偿还 ${money(n)} U 生活债务。`,'确认',()=>G[a](s,n));}if(a==='work'||a==='rest')dialog(a==='work'?'工作一天':'休息一天',`推进游戏内 24 小时。现有持仓将逐步经历行情、强平或结算，生活费和债息照常记账。${a==='work'?`最后领取 ${money(s.wage)} U 工资。`:'没有工资收入。'}`,'推进一天',()=>G.day(s,a==='work'));if(a==='asset'){const asset=s.assets.find(x=>x.id===b.dataset.id);dialog(`确认变卖${asset.name}`,`预计收入 ${money(Math.round(asset.value*asset.discount))} U，耗时 ${asset.days} 天。期间照常处理持仓、生活费与债息。\n${asset.id==='car'?'售后工资减少 15%，每日多花 20 U 通勤费。':asset.id==='home'?'售后每天新增 120 U 租金。':'出售后无法在本故事中回购。'}`,'确认出售',()=>G.sellAsset(s,asset.id));}if(a==='leave')dialog('现在收手吗？','现有仓位按当前份额价格卖出，扣除卖出费用与融资。随后封存这段故事，按财富、债务、资产和经历生成离场记录。','确认收手',()=>{G.finish(s,'leave');tab='ending';});if(a==='suicide')dialog('终止人物故事：跳楼','这是虚构人物的终止选择，不描写过程或展示相关画面。确认后故事停止，当前轨迹、资产和债务原样留档，不获得奖励，也不清除债务。\n你也可以取消，继续生活、工作、还款或普通离场。','确认终止故事',()=>{G.finish(s,'suicide');tab='ending';});}catch(e){notify(e.message);}});
$('file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>15000000)throw Error('存档过大（上限 15 MB）');const candidate=G.validate(JSON.parse(await file.text()));closeDialog();dialog('恢复这段故事',`导入第 ${Math.floor(candidate.time/1440)+1} 天的故事。当前故事如有，会先导出备份；导入后时钟保持暂停。`,'备份并恢复',()=>{if(s)exportSave();s=candidate;side='up';leverage=1;tab=s.ended?'ending':'trade';acc=0;last=performance.now();});}catch(err){notify('导入失败：'+err.message);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalOpen)closeDialog();if(e.key==='Tab'&&modalOpen){const focusable=$('modal').querySelectorAll('button,input');if(!focusable.length)return;const first=focusable[0],lastEl=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();lastEl.focus();}else if(!e.shiftKey&&document.activeElement===lastEl){e.preventDefault();first.focus();}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&s){s.paused=true;acc=0;persist();render();}last=performance.now();});window.addEventListener('pagehide',()=>{if(s){s.paused=true;persist();}});
setInterval(()=>{const now=performance.now(),delta=(now-last)/1000;last=now;if(!s||s.paused||s.ended||modalOpen||document.hidden||!s.round||s.round.guide&&!s.round.started){acc=0;return;}if(delta>1){s.paused=true;acc=0;persist();render();notify('检测到页面中断，行情已暂停。');return;}acc+=delta;let changed=false;while(acc>=.25&&s.round&&!s.paused){const guide=s.guide;G.advance(s,.25);acc-=.25;changed=true;if(s.guide!==guide){persist();dialog(s.events.at(-1).title,s.events.at(-1).text,'继续我的故事');break;}}if(changed){G.milestones(s);persist();refreshMarket();}},100);
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(render,120);});
try{const raw=localStorage.getItem(KEY);if(raw)s=G.validate(JSON.parse(raw));}catch(e){storageError=true;setTimeout(()=>notify('旧存档无法读取，原记录未覆盖。可先在存档面板导入备份。'),500);}render();
})();
</script></body></html>
